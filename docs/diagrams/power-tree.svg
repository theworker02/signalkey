<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-label="A power budget with explicit margins"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#567cb4"/></marker></defs><rect width="1200" height="770" fill="#fbfcff"/><g font-family="Arial, sans-serif"><text x="40" y="48" font-size="12" fill="#6580a4" font-weight="600">SIGNALKEY / MAGNEXIS</text><text x="40" y="90" font-size="29" fill="#132841" font-weight="600">A power budget with explicit margins</text><text x="40" y="121" font-size="15" fill="#31445c" font-weight="400">E1 electrical proposal · figures are calculated assumptions, not measurements or compliance evidence.</text><rect x="40" y="175" width="220" height="105" rx="10" fill="#eef3fb" stroke="#c4d1e3"/><text x="58" y="205" font-size="17" fill="#172b47" font-weight="600">USB-C receptacle</text><text x="58" y="232" font-size="14" fill="#51647c" font-weight="400">USB 2.0 device proposal</text><text x="58" y="255" font-size="14" fill="#51647c" font-weight="400">No battery or USB PD</text><rect x="320" y="175" width="240" height="105" rx="10" fill="#eef3fb" stroke="#c4d1e3"/><text x="338" y="205" font-size="17" fill="#172b47" font-weight="600">Input protection</text><text x="338" y="232" font-size="14" fill="#51647c" font-weight="400">VBUS / inrush / ESD</text><text x="338" y="255" font-size="14" fill="#51647c" font-weight="400">Exact circuit not released</text><path d="M260 223 L320 223" stroke="#567cb4" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><path d="M320 223 l-9 -4 L311 227Z" fill="#567cb4"/><rect x="650" y="175" width="230" height="105" rx="10" fill="#eef3fb" stroke="#c4d1e3"/><text x="668" y="205" font-size="17" fill="#172b47" font-weight="600">3.3 V logic supply</text><text x="668" y="232" font-size="14" fill="#51647c" font-weight="400">RP2040 + flash + support</text><text x="668" y="255" font-size="14" fill="#51647c" font-weight="400">75 mA input allowance</text><path d="M560 223 L650 223" stroke="#567cb4" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><path d="M650 223 l-9 -4 L641 227Z" fill="#567cb4"/><rect x="650" y="345" width="230" height="120" rx="10" fill="#eef3fb" stroke="#c4d1e3"/><text x="668" y="375" font-size="17" fill="#172b47" font-weight="600">Switched LED supply</text><text x="668" y="402" font-size="14" fill="#51647c" font-weight="400">TPS2553 candidate</text><text x="668" y="425" font-size="14" fill="#51647c" font-weight="400">RILIM = 100 kΩ ± 1%</text><text x="668" y="448" font-size="14" fill="#51647c" font-weight="400">Default-off EN control</text><path d="M595 223V400H647" stroke="#567cb4" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="930" y="345" width="230" height="120" rx="10" fill="#eef3fb" stroke="#c4d1e3"/><text x="948" y="375" font-size="17" fill="#172b47" font-weight="600">12-pixel RGB ring</text><text x="948" y="402" font-size="14" fill="#51647c" font-weight="400">Exact LED lot unresolved</text><text x="948" y="425" font-size="14" fill="#51647c" font-weight="400">Buffer + series resistor</text><text x="948" y="448" font-size="14" fill="#51647c" font-weight="400">Common ground</text><path d="M880 402 L930 402" stroke="#567cb4" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><path d="M930 402 l-9 -4 L921 406Z" fill="#567cb4"/><path d="M760 280 L760 345" stroke="#567cb4" fill="none" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M760 345 l4 -9 L756 336Z" fill="#567cb4"/><text x="793" y="314" font-size="13" fill="#31445c" font-weight="400">GP4 → EN</text><rect x="40" y="330" width="480" height="135" rx="10" fill="#eef3fb" stroke="#c4d1e3"/><text x="58" y="360" font-size="17" fill="#172b47" font-weight="600">Type-C standard contact mapping</text><text x="58" y="387" font-size="14" fill="#51647c" font-weight="400">A5 / CC1 → its own 5.1 kΩ Rd → GND</text><text x="58" y="410" font-size="14" fill="#51647c" font-weight="400">B5 / CC2 → its own 5.1 kΩ Rd → GND</text><text x="58" y="433" font-size="14" fill="#51647c" font-weight="400">A6 + B6 → D+; A7 + B7 → D−; ESD then MCU</text><text x="40" y="500" font-size="18" fill="#955f24" font-weight="600">Proposal only: this is a power/data block diagram, not a schematic or fabrication netlist.</text><text x="40" y="540" font-size="15" fill="#51647c" font-weight="400">Conservative normal-input scenario: 267.7 mA. Configured request: 500 mA.</text><text x="40" y="564" font-size="15" fill="#51647c" font-weight="400">Limiter bound from TI equations plus resistor tolerance: 232.0–305.8 mA.</text><text x="40" y="588" font-size="15" fill="#51647c" font-weight="400">Fault-limited input scenario including logic allowance: 380.8 mA; margin 119.2 mA.</text><text x="40" y="640" font-size="13" fill="#51647c" font-weight="400">Unconfigured: ≤100 mA. USB2 suspend: ≤2.5 mA including bus resistors. Neither is measured here.</text><text x="40" y="662" font-size="13" fill="#51647c" font-weight="400">Pin labels above are USB standard contacts, not a selected connector footprint. Shielding/anchors still need review.</text><text x="40" y="684" font-size="13" fill="#51647c" font-weight="400">Sources: USB Type-C 2.5 table 3-4 / table 4-28; USB2 suspend-current ECN; TI TPS2553 §9.5.1.</text><text x="40" y="745" font-size="12" fill="#637790" font-weight="400">2026-09-12 · Engineering revision E1 / mechanical M1 · Status labels are part of the drawing.</text></g></svg>