" font-weight="600">NOT BUILT</text><path d="M975 267 L988 267" stroke="#567cb4" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><path d="M988 267 l-9 -4 L979 271Z" fill="#567cb4"/><text x="994" y="181" font-size="16" fill="#567cb4" font-weight="600">06</text><rect x="990" y="200" width="175" height="145" rx="10" fill="#eef3fb" stroke="#c4d1e3"/><text x="1008" y="230" font-size="17" fill="#172b47" font-weight="600">Production</text><text x="1008" y="257" font-size="14" fill="#51647c" font-weight="400">Demand-dependent</text><text x="1008" y="280" font-size="14" fill="#51647c" font-weight="400">Approved release pack</text><text x="1002" y="324" font-size="10" fill="#7e5b30" font-weight="600">NOT APPROVED</text><rect x="40" y="395" width="550" height="135" rx="10" fill="#eef3fb" stroke="#c4d1e3"/><text x="58" y="425" font-size="17" fill="#172b47" font-weight="600">Quote scenarios are separate from stage quantities</text><text x="58" y="452" font-size="14" fill="#51647c" font-weight="400">RFQ: 10 engineering, 50 validation, 100 / 500 / 1,000 production.</text><text x="58" y="475" font-size="14" fill="#51647c" font-weight="400">These are comparisons for supplier estimates, not orders or forecasts.</text><text x="58" y="498" font-size="14" fill="#51647c" font-weight="400">No supplier or lab has been contacted.</text><rect x="620" y="395" width="540" height="135" rx="10" fill="#eef3fb" stroke="#c4d1e3"/><text x="638" y="425" font-size="17" fill="#172b47" font-weight="600">Release requires evidence, not a checklist alone</text><text x="638" y="452" font-size="14" fill="#51647c" font-weight="400">Reviewed CAD + BOM + binaries + fixture + compliance route.</text><text x="638" y="475" font-size="14" fill="#51647c" font-weight="400">First-article approval and traceable test records before production.</text><text x="638" y="498" font-size="14" fill="#51647c" font-weight="400">STL mesh checks do not establish electrical or mechanical reliability.</text><text x="40" y="570" font-size="12" fill="#637790" font-weight="400">2026-09-12 · Engineering revision E1 / mechanical M1 · Status labels are part of the drawing.</text></g></svg>