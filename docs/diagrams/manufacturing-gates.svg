<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="595" viewBox="0 0 1200 595" role="img" aria-label="Build stages and decision gates"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#567cb4"/></marker></defs><rect width="1200" height="595" fill="#fbfcff"/><g font-family="Arial, sans-serif"><text x="40" y="48" font-size="12" fill="#6580a4" font-weight="600">SIGNALKEY / MAGNEXIS</text><text x="40" y="90" font-size="29" fill="#132841" font-weight="600">Build stages and decision gates</text><text x="40" y="121" font-size="15" fill="#31445c" font-weight="400">Proposed sequence · quantities can change after review. No manufacturing stage is approved.</text><text x="44" y="181" font-size="16" fill="#567cb4" font-weight="600">01</text><rect x="40" y="200" width="175" height="145" rx="10" fill="#e7f4ed" stroke="#c4d1e3"/><text x="58" y="230" font-size="17" fill="#172b47" font-weight="600">Software proof</text><text x="58" y="257" font-size="14" fill="#51647c" font-weight="400">No hardware</text><text x="58" y="280" font-size="14" fill="#51647c" font-weight="400">Observed pass/fail</text><text x="52" y="324" font-size="10" fill="#287451" font-weight="600">VERIFIED SOFTWARE</text><path d="M215 267 L228 267" stroke="#567cb4" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><path d="M228 267 l-9 -4 L219 271Z" fill="#567cb4"/><text x="234" y="181" font-size="16" fill="#567cb4" font-weight="600">02</text><rect x="230" y="200" width="175" height="145" rx="10" fill="#eef3fb" stroke="#c4d1e3"/><text x="248" y="230" font-size="17" fill="#172b47" font-weight="600">Prototype</text><text x="248" y="257" font-size="14" fill="#51647c" font-weight="400">1–3 units</text><text x="248" y="280" font-size="14" fill="#51647c" font-weight="400">Reviewed safe wiring</text><text x="242" y="324" font-size="10" fill="#7e5b30" font-weight="600">NOT BUILT</text><path d="M405 26