<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="#fff"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#22334b} .small{font-size:17px} .label{font-size:20px} .title{font-size:31px;font-weight:600}</style><text x="40" y="48" font-family="Arial" font-size="31" fill="#22334b" text-anchor="start">M1 / original five-part fit study</text><text x="40" y="80" font-family="Arial" font-size="17" fill="#22334b" text-anchor="start">Historical compact concept • All mm • Not compatible with selected 38.1 mm-deep arcade switch</text><path d="M40,100 L1160,100" fill="none" stroke="#d8dfe7" stroke-width="2"/><rect x="110" y="190" width="275" height="275" rx="40" fill="#f3f5f8" stroke="#34475f" stroke-width="2"/><circle cx="247.5" cy="327.5" r="107.5" fill="#d4eef9" stroke="#34475f" stroke-width="2"/><circle cx="247.5" cy="327.5" r="90" fill="#eef2f6" stroke="#34475f" stroke-width="2"/><path d="M110,165 L385,165" fill="none" stroke="#46759b" stroke-width="1.3"/><path d="M110,158 L110,172" fill="none" stroke="#26384d" stroke-width="2"/><path d="M385,158 L385,172" fill="none" stroke="#26384d" stroke-width="2"/><text x="247.5" y="155" font-family="Arial" font-size="17" fill="#22334b" text-anchor="middle">55</text><path d="M82,190 L82,465" fill="none" stroke="#46759b" stroke-width="1.3"/><path d="M75,190 L89,190" fill="none" stroke="#26384d" stroke-width="2"/><path d="M75,465 L89,465" fill="none" stroke="#26384d" stroke-width="2"/><text x="70" y="327.5" font-family="Arial" font-size="17" fill="#22334b" text-anchor="end">55</text><circle cx="147.5" cy="227.5" r="6" fill="#fff" stroke="#34475f" stroke-width="2"/><circle cx="147.5" cy="427.5" r="6" fill="#fff" stroke="#34475f" stroke-width="2"/><circle cx="347.5" cy="227.5" r="6" fill="#fff" stroke="#34475f" stroke-width="2"/><circle cx="347.5" cy="427.5" r="6" fill="#fff" stroke="#34475f" stroke-width="2"/><text x="485" y="175" font-family="Arial" font-size="17" fill="#22334b" text-anchor="start">Base:55×55×20; wall2.2</text><text x="485" y="209" font-family="Arial" font-size="17" fill="#22334b" text-anchor="start">Lid:55×55×2; undersideZ20</text><text x="485" y="243" font-family="Arial" font-size="17" fill="#22334b" text-anchor="start">Cap:bodyØ36, flangeØ38.5; topZ24</text><text x="485" y="277" font-family="Arial" font-size="17" fill="#22334b" text-anchor="start">Lid boreØ36.7 → radial gap0.35</text><text x="485" y="311" font-family="Arial" font-size="17" fill="#22334b" text-anchor="start">Carrier:topZ18.2 / bottomZ16.4</text><text x="485" y="345" font-family="Arial" font-size="17" fill="#22334b" text-anchor="start">Flange undersideZ18.8 → travel0.6</text><text x="485" y="379" font-family="Arial" font-size="17" fill="#22334b" text-anchor="start">Diffuser:Ø43 / ID36.7 / height1.4</text><text x="485" y="413" font-family="Arial" font-size="17" fill="#22334b" text-anchor="start">Diffuser seatZ21.4; topZ22.8</text><text x="485" y="447" font-family="Arial" font-size="17" fill="#22334b" text-anchor="start">Rear opening12×6 atZ8.8</text><text x="485" y="481" font-family="Arial" font-size="17" fill="#22334b" text-anchor="start">Lid screwsX±20,Y±20; Ø2.4</text><text x="485" y="515" font-family="Arial" font-size="17" fill="#22334b" text-anchor="start">Carrier screwsX±22,Y±9; Ø2.4</text><text x="90" y="545" font-family="Arial" font-size="20" fill="#22334b" text-anchor="start">Installation: board/harness → carrier → cap inserted from BELOW lid → lid/cap → diffuser.</text><text x="90" y="585" font-family="Arial" font-size="17" fill="#22334b" text-anchor="start">Cap flange cannot pass through the lid hole. No selected spring/switch proves return.</text><text x="90" y="620" font-family="Arial" font-size="17" fill="#22334b" text-anchor="start">Diffuser has no validated retention; PCB/connector/fasteners remain supplier dependencies.</text><text x="90" y="655" font-family="Arial" font-size="17" fill="#22334b" text-anchor="start">Nominal collision audit covers all10 pairs,13 travel positions, tool access and a Ø3 route.</text><text x="90" y="700" font-family="Arial" font-size="17" fill="#22334b" text-anchor="start">Do not interpret sampled CAD travel, mesh closure or a diagram as physical qualification.</text></svg>