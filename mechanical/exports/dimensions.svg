<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Enclosure envelope and fit-study dimensions"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#567cb4"/></marker></defs><rect width="1200" height="750" fill="#fbfcff"/><g font-family="Arial, sans-serif"><text x="40" y="48" font-size="12" fill="#6580a4" font-weight="600">SIGNALKEY / MAGNEXIS</text><text x="40" y="90" font-size="29" fill="#132841" font-weight="600">Enclosure envelope and fit-study dimensions</text><text x="40" y="121" font-size="15" fill="#31445c" font-weight="400">M1 parametric model · 55 × 55 × 24 mm assembled envelope, excluding optional feet.</text><rect x="80" y="210" width="330" height="330" rx="48" fill="#edf2fa" stroke="#536b8f" stroke-width="2"/><circle cx="245" cy="375" r="108" fill="#d7e6f8" stroke="#536b8f"/><circle cx="245" cy="375" r="129" fill="none" stroke="#8ba6c9"/><circle cx="125" cy="255" r="7.2" fill="none" stroke="#536b8f"/><circle cx="125" cy="495" r="7.2" fill="none" stroke="#536b8f"/><circle cx="365" cy="255" r="7.2" fill="none" stroke="#536b8f"/><circle cx="365" cy="495" r="7.2" fill="none" stroke="#536b8f"/><path d="M80 180 L410 180" stroke="#567cb4" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><path d="M410 180 l-9 -4 L401 184Z" fill="#567cb4"/><text x="218" y="168" font-size="16" fill="#31445c" font-weight="400">55 mm</text><text x="90" y="576" font-size="14" fill="#31445c" font-weight="400">Top: four lid holes on 40 × 40 mm centers</text><rect x="570" y="370" width="330" height="120" fill="#edf2fa" stroke="#536b8f"/><rect x="570" y="358" width="330" height="12" fill="#d4dfee" stroke="#536b8f"/><rect x="627" y="346" width="216" height="12" fill="#c2d9f0" stroke="#536b8f"/><path d="M944 346 L944 490" stroke="#567cb4" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><path d="M944 490 l4 -9 L940 481Z" fill="#567cb4"/><text x="964" y="425" font-size="16" fill="#31445c" font-weight="400">24 mm</text><text x="570" y="535" font-size="14" fill="#31445c" font-weight="400">Side: body 20 + lid 2 + cap projection 2 = 24 mm</text><text x="570" y="215" font-size="15" fill="#51647c" font-weight="400">Cap body Ø36 mm; lid opening Ø36.7 mm.</text><text x="570" y="239" font-size="15" fill="#51647c" font-weight="400">Nominal radial clearance: 0.35 mm.</text><text x="570" y="263" font-size="15" fill="#51647c" font-weight="400">Carrier stop sets 0.6 mm modeled travel.</text><text x="570" y="287" font-size="15" fill="#51647c" font-weight="400">Rear cutout: 12 × 6 mm, center Z = 8.8 mm.</text><text x="40" y="625" font-size="14" fill="#51647c" font-weight="400">Dimensions describe the M1 model only. Units: mm. Not a toleranced production drawing.</text><text x="40" y="648" font-size="14" fill="#51647c" font-weight="400">Switch return mechanism, fastener engagement, actual PCB and USB connector fit remain unresolved.</text><text x="40" y="671" font-size="14" fill="#51647c" font-weight="400">STLs are normalized for printing; assembly Z references are retained in enclosure.scad.</text><text x="40" y="725" font-size="12" fill="#637790" font-weight="400">2026-09-12 · Engineering revision E1 / mechanical M1 · Status labels are part of the drawing.</text></g></svg>